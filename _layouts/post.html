---
layout: default
---

<div class="project-header-bg">
    <div class="container">
        <h1>{{ page.title }}</h1>
        <div class="tags">
            {% for tag in page.tags %}
            <span class="tag" style="background: rgba(255,255,255,0.2); color: white;">{{ tag }}</span>
            {% endfor %}
        </div>
    </div>
</div>

<div class="container" style="margin-top: -30px; position: relative; z-index: 10;">
    <div style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">

        {% if page.youtube_id %}
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/{{ page.youtube_id }}" frameborder="0" allowfullscreen></iframe>
        </div>
        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        {% elsif page.thumbnail %}
        <img src="{{ page.thumbnail }}" alt="{{ page.title }}" style="width: 100%; border-radius: 6px; margin-bottom: 30px;">
        {% endif %}

        <div style="margin-bottom: 30px;">
            {% if page.github_link %}
            <a href="{{ page.github_link }}" class="btn">View Code on GitHub</a>
            {% endif %}
        </div>

        <article class="prose">
            {{ content }}
        </article>

    </div>
</div>
