---
layout: default
---

<div class="project-header-bg">
    <div class="container">
        <h1>{{ page.title }}</h1>
        <div class="tags">
            {% for tag in page.tags %}
            <span class="tag" style="background: rgba(255,255,255,0.2); color: white;">{{ tag }}</span>
            {% endfor %}
        </div>
    </div>
</div>

<div class="container" style="margin-top: 40px; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">

    <div style="margin-bottom: 30px;">
        {% if page.github_link %}
        <a href="{{ page.github_link }}" class="btn">View Code</a>
        {% endif %}
    </div>

    <article class="prose">
        {{ content }}
    </article>
</div>
