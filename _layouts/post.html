<div class="container" style="margin-top: 40px; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">

    {% if page.youtube_id %}
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/{{ page.youtube_id }}" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

    {% elsif page.thumbnail %}
    <img src="{{ page.thumbnail }}" alt="{{ page.title }}" style="width: 100%; border-radius: 4px; margin-bottom: 30px;">
    {% endif %}


    <div style="margin-bottom: 30px;">
        {% if page.github_link %}
        <a href="{{ page.github_link }}" class="btn">View Code on GitHub</a>
        {% endif %}
    </div>

    <article class="prose">
        {{ content }}
    </article>
</div>
