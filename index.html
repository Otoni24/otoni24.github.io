<h1>I Miei Progetti</h1>

<ul>
  {% for project in site.projects %}
    <li>
      <h2><a href="{{ project.url }}">{{ project.title }}</a></h2>
      
      <p>{{ project.description }}</p>
      
      <p><strong>Tecnologie:</strong> {{ project.tags | join: ", " }}</p>
    </li>
  {% endfor %}
</ul>
